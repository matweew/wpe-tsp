# WPE Browser settings. Read by launch.sh at every start; never overwritten by updates.

# Page opened at start and by "Home" in the SELECT menu, e.g. "https://en.wikipedia.org".
# Empty: the browser starts with the address bar open.
HOME_URL=""

# What to open at start: "home" (HOME_URL), "last" (the last visited page, from History;
# HOME_URL if History is empty) or "address" (an empty page with the address bar open).
START_PAGE="home"

# Address-bar input that isn't a URL is searched here (the query is appended).
#   DuckDuckGo: https://duckduckgo.com/?q=    Bing: https://www.bing.com/search?q=
SEARCH_URL="https://www.google.com/search?q="

# Page scale: 1.5 = text 1.5x larger (pages still render at the screen's full resolution).
# Empty = per device, about the same text size on each: Smart Pro 1.5, Brick 2.0, Brick Pro 1.65.
SCALE=""

# Memory a page may use (MB) before it is closed with a "needs more memory" message.
# WebKit starts freeing caches at 40%/60% of it. A system watchdog also closes the page
# when the device itself runs low (under ~90 MB free), as a safety net.
PAGE_MEMORY_LIMIT_MB=550

# Hide the pointer after this many seconds without moving it (0 = never hide).
# Moving the left stick or pressing A shows it again (A then doesn't click).
POINTER_HIDE_SECONDS=10

# Number of recently visited pages kept in History (SELECT menu; 0 = don't record).
HISTORY_SIZE=20

# Where downloaded files are saved (created if missing).
DOWNLOAD_DIR="/mnt/SDCARD/Downloads"

# YouTube only (all other videos and audio play inside the page):
# 0 = YouTube plays inside the page too, decoded in software (~46% CPU).
# 1 = YouTube video pages and embedded YouTube players play in the bundled mpv, with the hardware
# H.264 decoder (smooth 720p, light on CPU and memory), via yt-dlp (checked for updates once a
# day, with an offer to install a newer one). The video page stays open (description, comments)
# with a "Play in mpv" button to watch again.
PLAY_YOUTUBE_IN_MPV=0

# H.264 video in pages on the Allwinner hardware decoder (Cedar): 720p at ~13% CPU instead of ~70%.
# Falls back to software decoding by itself where the hardware can't be used. With it, YouTube in
# the page is asked for H.264 instead of VP9 (no hardware support). 0 = software decoding only.
HW_VIDEO_DECODE=1

# Browser identity: "mobile" (iPhone Safari: lighter mobile sites, best for 1 GB RAM),
# "desktop" (WPE's own Linux UA) or a full user-agent string. SELECT menu ->
# "Request desktop/mobile site" switches for the current session.
USER_AGENT="mobile"

# Block ads and trackers (EasyList + EasyPrivacy domain rules, ~94k). The rule list is
# compiled once after an update (~25 s in the background), then loads instantly. 0 = off.
AD_BLOCK=1

# WebGL (3D graphics in pages, via ANGLE on the PowerVR GPU). Costs nothing on pages without
# 3D content; 3D pages use more memory. 0 = off.
WEBGL=1

# Keyboard layouts, for the on-screen keyboard and a USB keyboard: XKB layout names,
# optionally with a variant, e.g. "us,ua,de(nodeadkeys)" (any layout of a Linux desktop works).
# The first is the default; the language key / Alt+Shift / Super+Space switch. Keep a Latin
# layout (us) in the list for typing addresses.
KEYBOARD_LAYOUTS="us,ua,ru"
