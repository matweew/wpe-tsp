# mpv.conf for Trimui Smart Pro (PowerVR GE8300 / GLES 3.2 / 720p)
#
# vo=gpu uses ra_gl_ctx (our context_sdl.c) which lets SDL2 manage EGL.
# vo=gpu-next uses libplacebo's own EGL init which fails on fbdev/PowerVR.
vo=gpu
gpu-context=sdl
hwdec=no
# H.264 on the Allwinner Cedar hardware decoder (FFmpeg h264_cedar, libcedarc): about a third
# of the CPU of software decoding. The trailing comma lets mpv fall back to the software
# decoders for everything else (other codecs, 10-bit/4:2:2/4:4:4 H.264, or if it fails).
vd=h264_cedar,
# OpenGL ES via SDL2/mali-fbdev/GE8300
gpu-api=opengl
# OSC disabled: Lua 5.1 on device raises integer/number type error in mouse area calls
osc=no
# Explicit font name: libass is built without fontconfig, so generic names like
# "sans-serif" can't be aliased. "DejaVu Sans" matches the bundled TTF exactly.
osd-font=DejaVu Sans
sub-font=DejaVu Sans
# Keep scalers cheap for embedded GPU
scale=bilinear
cscale=bilinear
dscale=bilinear
interpolation=no
deband=no
correct-downscaling=no
sigmoid-upscaling=no
ao=sdl
audio-channels=stereo
input-gamepad=yes
osd-bar=yes
osd-font-size=28
osd-duration=2000
sub-auto=fuzzy
sub-font-size=32
cache=yes
demuxer-max-bytes=50MiB
demuxer-max-back-bytes=25MiB
